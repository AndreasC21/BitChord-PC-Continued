[package]
name = "bitchord-party-client-tests"
version = "0.1.0"
edition = "2024"
publish = false

# This harness imports the production client without building the GUI/audio stack.
[workspace]

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
futures-util = { version = "0.3", features = ["sink"] }
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "native-tls"] }
url = "2"
